[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar-bench"
version = "0.1.0"
description = "An installable library for reproducing the RADAR routing benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "litellm>=1.99.0",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "torch>=2.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radar_bench"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "pydantic"
]
